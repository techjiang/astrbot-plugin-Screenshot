# 运行环境：Python 由镜像提供。
# 默认构建镜像只有 node，既没有 python、也没有 python3
# （实测 `python3 -m compileall` → `sh: python3: command not found`，127），
# 所以这里必须显式给一个带 Python 的镜像。
# 用 bookworm 变体：trixie 的 python:3.11-slim 要 GLIBC_2.38，跟 runner 宿主
# 对不上，运行时会直接挂；bookworm 变体可正常执行。仓库已有 3.11 语法
# （`X | Y` 类型标注），所以固定 3.11 而不是 3.12。
#
# 依赖情况：
#   - tests/test_parse.py 经 core.image 间接 import PIL，需要 requirements.txt
#   - tests/test_metadata.py 的 Logo 渲染侧断言要读 PNG 像素（Pillow）
#   - tests/test_docs.py 纯静态、零依赖
# 需要依赖的 Stage 都在同一个脚本里「先装依赖、再跑检查」。
#
# 注意：tests/test_parse.py 的设计目标是「不依赖 AstrBot / 浏览器」。
# 一旦有人为了测某个纯函数直接 `from core.session import ...`，就会把
# astrbot / aiohttp 一起拖进来，这个 Stage 立刻
# `ModuleNotFoundError: No module named 'astrbot'`。要测这类函数，
# 用 tests/test_parse.py 里 `_load_plan_strips()` 那种「按源码抠出纯函数」的办法。
#
# 注意：不要写成 `pip install ... && python3 xxx`。CNB 的 script 是每次
# 新建 shell 执行的，`pip install` 会以 exit 0 收尾，若某个镜像里 pip 不存在
# （打印 127 后仍退出 0，CNB 不按 127 判错），&& 后的检查就会被整个跳过、
# Stage 假绿。写成多行，让检查一定执行，由检查自己决定 Stage 的成败。
#
# 另外 Pillow 缺位时 tests/test_metadata.py 只打 [SKIP] 并以 0 退出，
# 等于断言被静默跳过，所以这里显式 --require-pillow 把它变成 FAIL。
.docker-config: &docker-config
  docker:
    image: python:3.11-slim-bookworm

main:
  push:
    - <<: *docker-config
      stages:
        - name: 语法检查
          script: python3 -m compileall -q .
        - name: metadata 自检
          script: |
            python3 -m pip install -r requirements.txt
            python3 tests/test_metadata.py --require-pillow
  pull_request:
    - <<: *docker-config
      stages:
        - name: 语法检查
          script: python3 -m compileall -q .
        - name: 指令解析回归
          script: |
            python3 -m pip install -r requirements.txt
            python3 tests/test_parse.py
        - name: 文档一致性检查
          script: python3 tests/test_docs.py
        - name: metadata 自检
          script: |
            python3 -m pip install -r requirements.txt
            python3 tests/test_metadata.py --require-pillow$:
  # 打 tag 时自动产出可直接上架的安装包，并挂到同名 Release 上。
  #
  # 为什么要有这一段：AstrBot 商店提交的是一个 zip，而 zip 的结构决定插件
  # 装上去之后叫什么、以及平台侧读到的 metadata 是否正确。
  # v0.5.3 的包是人工在本地打的，根目录写死了旧名字，于是 metadata.yaml 里的
  # name 与包内目录名分叉 —— 装上去目录叫一个名字、身份登记是另一个名字。
  # 现在由流水线从仓库内容现包：包名、包内根目录都跟着 metadata.yaml 的 name 走。
  #
  # 为什么挂 tag_push 而不是 Release 页面：CNB 的触发事件里**没有 release 事件**
  # （只有 tag_push / auto_tag / tag_deploy.*），写在 $ 下的 release: 是死配置，
  # 我一开始就写错过，白等了一轮。tag 一推就出包，正好。
  #
  # 注意：CNB 的 script 每次都是新 shell。跨 Stage 传值只有一条路：脚本输出
  # `##[set-output key=value]` + Stage 的 exports 映射成环境变量（见下）。
  # 插值一律用 python 读文件算，不在 shell 里拼 ${{...}}（$ 在 .cnb.yml 里
  # 是脚本插值，套在命令里容易被吃掉一层）。
$:
  tag_push:
    - <<: *docker-config
      stages:
        - name: 确认标签与 metadata 版本一致
          script: |
            python3 - <<'PY'
            # 打 tag 最容易出的事是「tag 名和 metadata.yaml 的 version 对不上」，
            # 那样包会挂在一个错误的版本号下。这里先卡一道。
            import os, pathlib, re
            ref = os.environ.get("CNB_BRANCH") or ""
            text = pathlib.Path("metadata.yaml").read_text(encoding="utf-8")
            ver = re.search(r"^version:\s*(\S+)", text, re.M).group(1)
            name = re.search(r"^name:\s*(\S+)", text, re.M).group(1)
            assert ref == f"v{ver}", f"标签 {ref} 与 metadata.yaml 的版本 {ver} 不一致"
            print(f"[OK] 标签 {ref} 对应 {name} {ver}")
            PY
        - name: 打包安装包
          script: |
            python3 - <<'PY'
            import pathlib, re, shutil, zipfile

            root = pathlib.Path(".").resolve()
            text = (root / "metadata.yaml").read_text(encoding="utf-8")
            name = re.search(r"^name:\s*(\S+)", text, re.M).group(1)
            ver = re.search(r"^version:\s*(\S+)", text, re.M).group(1)
            zip_name = f"{name}-v{ver}.zip"

            stage = pathlib.Path("/tmp/pkg") / name
            if stage.parent.exists():
                shutil.rmtree(stage.parent)
            stage.mkdir(parents=True)

            # 只装插件本体：版本控制、CI 配置、缓存不进包
            skip_dirs = {".git", ".cnb", "__pycache__", ".venv", "node_modules"}
            skip_files = {".gitignore", ".cnb.yml"}
            for path in root.rglob("*"):
                rel = path.relative_to(root)
                if any(part in skip_dirs for part in rel.parts):
                    continue
                if path.is_dir():
                    continue
                if rel.name in skip_files or rel.suffix == ".pyc":
                    continue
                target = stage / rel
                target.parent.mkdir(parents=True, exist_ok=True)
                shutil.copy2(path, target)

            out = pathlib.Path("/tmp") / zip_name
            with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as zf:
                for path in sorted(stage.rglob("*")):
                    if path.is_file():
                        zf.write(path, path.relative_to(stage.parent))

            # 自校验：包内根目录必须与 metadata.name 一致，关键文件必须在
            with zipfile.ZipFile(out) as zf:
                names = zf.namelist()
            roots = {n.split("/")[0] for n in names}
            assert roots == {name}, f"包内根目录 {roots} 与 metadata.name {name} 不一致"
            for required in ("metadata.yaml", "logo.png", "main.py", "requirements.txt"):
                assert f"{name}/{required}" in names, f"包内缺少 {required}"
            assert not any("/.git/" in n for n in names), "包里混进了 .git"
            print(f"[OK] {zip_name}：{len(names)} 个文件，根目录 {name}")
            print(f"[OK] 大小 {out.stat().st_size} 字节")
            PY
            # 包名要传给后面的 Stage。CNB 的跨 Stage 传值只有一条路：
            # 脚本输出 `##[set-output key=value]`，再由 exports 映射成环境变量。
            # （不要试图往某个 CNB_ 前缀的文件变量里写 —— 那类变量不存在，
            #   语义校验会直接拦下。）
            python3 - <<'PY'
            import pathlib, re
            text = pathlib.Path("metadata.yaml").read_text(encoding="utf-8")
            name = re.search(r"^name:\s*(\S+)", text, re.M).group(1)
            ver = re.search(r"^version:\s*(\S+)", text, re.M).group(1)
            print(f"##[set-output zip_name={name}-v{ver}.zip]")
            PY
          exports:
            zip_name: ZIP_NAME
        - name: 创建 / 更新 Release
          script: |
            python3 - <<'PY'
            # 先建/更新 Release（带上正文），后面才有 release-id 可以挂附件。
            # 重复推送同一个 tag 要幂等：已存在就更新，不报错。
            #
            # 这里直接用 HTTP 打 API，不走 `cnb` CLI —— 构建镜像里没有这个可执行文件
            # （实测 `FileNotFoundError: 'cnb'`）。CNB 提供现成的两个变量：
            # CNB_API_ENDPOINT（API 地址）与 CNB_TOKEN（构建凭证，tag_push 有写权限）。
            import json, os, pathlib, urllib.error, urllib.request

            api = os.environ["CNB_API_ENDPOINT"].rstrip("/")
            token = os.environ["CNB_TOKEN"]
            repo = os.environ["CNB_REPO_SLUG"]
            tag = os.environ["CNB_BRANCH"]
            base = f"{api}/{repo}/-/releases"
            # Accept 必须显式给 application/json：只带 Authorization 会被 API 以
            # 406 Not Acceptable 拒掉（默认的 */* 不被接受）。
            auth = {"Authorization": f"Bearer {token}",
                    "Content-Type": "application/json",
                    "Accept": "application/json"}

            def call(method, url, payload=None, missing_ok=False):
                """missing_ok=True 时，404 返回 None 而不是抛错。

                为什么不直接 except HTTPError 判 404：那样得把真正的失败
                （401/403/500）也一并吞掉，问题会被伪装成「Release 不存在 → 去创建」，
                然后创建又失败，报错完全对不上。所以单独给一个显式开关。

                另外错误信息里必须带接口正文：只留状态码的话，404 到底是路径写错、
                还是 Release 真没有，从日志上根本分不出来（这一轮就是这么卡住的）。
                """
                data = json.dumps(payload).encode() if payload is not None else None
                req = urllib.request.Request(url, data=data, method=method, headers=auth)
                try:
                    with urllib.request.urlopen(req, timeout=60) as resp:
                        body = resp.read()
                except urllib.error.HTTPError as exc:
                    detail = exc.read()[:500]
                    if missing_ok and exc.code == 404:
                        return None
                    raise AssertionError(
                        f"{method} {url} -> HTTP {exc.code}: {detail!r}") from exc
                return json.loads(body) if body else {}

            # Release 正文取 CHANGELOG 里当前版本那一节，避免正文与仓库里的变更记录
            # 各写一份然后慢慢脱节。
            lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
            start = next((i for i, l in enumerate(lines)
                          if l.startswith("## ") and tag.lstrip("v") in l), 0)
            section, headings = [], 0
            for line in lines[start:]:
                if line.startswith("## "):
                    headings += 1
                    if headings > 1:
                        break
                section.append(line)
            notes = "\n".join(section).strip() or f"{tag}"

            def release_id_of(info):
                """取 Release id。

                这个接口**直接返回对象**，没有 CLI 那层的 {"data": ...} 外壳
                （实测 GET /-/releases/tags/<tag> 顶层就是 id/tag_name/body...）。
                两种形状都兜一下：将来平台套上外壳也不会突然炸。
                """
                payload = info.get("data") if isinstance(info.get("data"), dict) else info
                assert payload.get("id"), f"响应里没有 release id：{info!r}"
                return payload["id"]

            info = call("GET", f"{base}/tags/{tag}", missing_ok=True)
            if info:
                release_id = release_id_of(info)
                # 用 PATCH 更新正文，幂等：同一个 tag 重复推不会报「已存在」
                call("PATCH", f"{base}/{release_id}",
                     {"body": notes, "make_latest": "true"})
                print(f"[OK] 更新已有 Release {tag}（id={release_id}）")
            else:
                info = call("POST", base, {"tag_name": tag, "name": tag,
                                          "body": notes, "make_latest": "true"})
                release_id = release_id_of(info)
                print(f"[OK] 创建 Release {tag}（id={release_id}）")

            # 把 release_id 交给下一个 Stage
            print(f"##[set-output release_id={release_id}]")
            PY
          exports:
            release_id: RELEASE_ID
        - name: 上传安装包为 Release 附件
          script: |
            python3 - <<'PY'
            import json, os, pathlib, urllib.error, urllib.request

            zip_name = os.environ["ZIP_NAME"]
            path = pathlib.Path("/tmp") / zip_name
            assert path.is_file(), f"没找到 {path}"

            api = os.environ["CNB_API_ENDPOINT"].rstrip("/")
            token = os.environ["CNB_TOKEN"]
            repo = os.environ["CNB_REPO_SLUG"]
            tag = os.environ["CNB_BRANCH"]
            release_id = os.environ["RELEASE_ID"]
            auth = {"Authorization": f"Bearer {token}",
                    "Content-Type": "application/json",
                    "Accept": "application/json"}

            # 先要一个上传地址，再 PUT 文件本体
            # 路径是 asset-upload-url（连字符，不是 /assets/upload-url），
            # 参数名是 asset_name（不是 name）—— 这两处都实测撞过 404 / 400。
            payload = json.dumps({"asset_name": zip_name,
                                  "size": path.stat().st_size,
                                  "overwrite": True}).encode()
            req = urllib.request.Request(
                f"{api}/{repo}/-/releases/{release_id}/asset-upload-url",
                data=payload, method="POST", headers=auth)
            try:
                with urllib.request.urlopen(req, timeout=60) as resp:
                    payload_out = json.loads(resp.read())
            except urllib.error.HTTPError as exc:
                raise AssertionError(
                    f"取上传地址失败 HTTP {exc.code}: {exc.read()[:500]!r}") from exc
            # 同上一 Stage：这个接口直接返回对象，没有 {"data": ...} 外壳，两种都兜
            body = payload_out.get("data") if isinstance(payload_out.get("data"), dict) \
                else payload_out
            upload_url = body.get("upload_url") or body.get("url")
            verify_url = body.get("verify_url")
            assert upload_url, f"响应里没有上传地址：{payload_out!r}"
            assert verify_url, f"响应里没有 verify_url：{payload_out!r}"

            req = urllib.request.Request(
                upload_url, data=path.read_bytes(), method="PUT",
                headers={"Content-Type": "application/zip"})
            with urllib.request.urlopen(req, timeout=300) as resp:
                print(f"[OK] 文件本体已 PUT（HTTP {resp.status}）")

            # PUT 成功 ≠ 附件生效。这一步是**必须**的：拿 upload_url 传完文件后，
            # 还要回 verify_url 确认，平台才会把它登记成 Release 附件。
            # 漏掉它的表现是接口全绿、Release 也建好了，但附件列表是空的，
            # 下载地址 404 "release asset ... not found" —— 我就是这么踩的。
            # verify_url 里已经带上了 upload_token 与 asset_path，直接 POST 即可。
            conf = urllib.request.Request(
                verify_url, data=b"", method="POST",
                headers={"Authorization": f"Bearer {token}",
                         "Accept": "application/json"})
            try:
                with urllib.request.urlopen(conf, timeout=120) as resp:
                    print(f"[OK] 附件已确认登记（HTTP {resp.status}）")
            except urllib.error.HTTPError as exc:
                raise AssertionError(
                    f"确认附件失败 HTTP {exc.code}: {exc.read()[:500]!r}") from exc

            # 最后自校验：附件必须真的能查到，不能只看前面几步的退出码
            check = urllib.request.Request(
                f"{api}/{repo}/-/releases/tags/{tag}",
                headers={"Authorization": f"Bearer {token}",
                         "Accept": "application/json"})
            with urllib.request.urlopen(check, timeout=60) as resp:
                info = json.loads(resp.read())
            payload = info.get("data") if isinstance(info.get("data"), dict) else info
            names = [a.get("name") for a in (payload.get("assets") or [])]
            assert zip_name in names, f"附件没登记上，当前附件列表：{names}"
            print(f"[OK] 附件已在 Release 上：{names}")
            print(f"下载地址：https://cnb.cool/{repo}/-/releases/download/{tag}/{zip_name}")
            PY
